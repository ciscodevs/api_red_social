<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      
      <h2 class="fw-bold mb-4 text-primary"><i class="bi bi-chat-heart-fill me-2"></i>Feed Social</h2>

      <div class="card shadow-sm border-0 mb-5 p-3" style="border-radius: 15px;">
        <div class="card-body">
          <div class="d-flex gap-3 mb-3">
            <img src="https://ui-avatars.com/api/?name=Usuario&background=random" class="rounded-circle" width="45" height="45">
            <textarea [(ngModel)]="postText" 
                      class="form-control border-0 bg-light shadow-none" 
                      rows="3" 
                      placeholder="¿Qué estás pensando?"
                      style="border-radius: 12px; resize: none;"></textarea>
          </div>
          <div class="d-flex justify-content-end border-top pt-3">
            <button (click)="publish()" 
                    class="btn btn-primary px-4 fw-bold rounded-pill shadow-sm"
                    [disabled]="!postText.trim()">
              Publicar
            </button>
          </div>
        </div>
      </div>

      <div class="feed-list">
        @for(post of posts(); track post) {
          <div class="card shadow-sm border-0 mb-4 animate__animated animate__fadeInUp" style="border-radius: 15px;">
            <div class="card-body">
              <div class="d-flex align-items-center mb-3">
                <img src="https://ui-avatars.com/api/?name=F&background=0D6EFD&color=fff" class="rounded-circle me-2" width="35" height="35">
                <div>
                  <h6 class="mb-0 fw-bold">Familiar</h6>
                  <small class="text-muted">Recién publicado</small>
                </div>
              </div>
              <p class="card-text text-dark fs-5 ps-1">{{post.text}}</p>
              
              <div class="d-flex gap-4 border-top pt-2 mt-3 text-muted">
                <span class="small cursor-pointer"><i class="bi bi-heart me-1"></i> Me gusta</span>
                <span class="small cursor-pointer"><i class="bi bi-chat me-1"></i> Comentar</span>
              </div>
            </div>
          </div>
        } @empty {
          <div class="text-center py-5 text-muted">
            <i class="bi bi-journal-richtext display-1"></i>
            <p class="mt-3">Aún no hay publicaciones. ¡Sé el primero!</p>
          </div>
        }
      </div>

    </div>
  </div>
</div>
